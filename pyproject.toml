[project]
name = "protocol-to-data"
version = "0.1.0"
description = "Protocol-to-Data Compliance Pipeline: CDISC SDTM mapping, conformance validation, LLM eligibility-criteria extraction and protocol-deviation detection over the public CDISC pilot study."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Amith" }]

dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
app = ["streamlit>=1.39", "altair>=5.4"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real network or LLM API; deselected by default in CI",
]

[tool.coverage.run]
source = ["src/p2d"]
